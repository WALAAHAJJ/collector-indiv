spring.application.name=notification-service
# Jetons émis par Keycloak : l'émetteur (iss) doit être l'adresse publique du realm,
# les clés publiques sont téléchargées à l'adresse jwk-set-uri (dans Docker : keycloak:8080).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/collector}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/collector/protocol/openid-connect/certs}

# Écoute des événements d'annonces (désactivée dans les tests, qui n'ont pas de RabbitMQ)
app.events.enabled=true

# Connexion à RabbitMQ : spring.rabbitmq.* (variables SPRING_RABBITMQ_* dans Docker Compose)
# Une panne de RabbitMQ ne doit pas rendre l'API des notifications indisponible.
management.health.rabbit.enabled=false
