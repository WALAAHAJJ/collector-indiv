spring.application.name=payment-service
# Jetons émis par Keycloak : l'émetteur (iss) doit être l'adresse publique du realm,
# les clés publiques sont téléchargées à l'adresse jwk-set-uri (dans Docker : keycloak:8080).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/collector}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/collector/protocol/openid-connect/certs}

# La base de données se configure par spring.datasource.* (variables SPRING_DATASOURCE_* dans Docker Compose).

# Base de données : le schéma est créé et modifié par Flyway (src/main/resources/db/migration),
# Hibernate se contente de vérifier qu'il correspond aux entités.
# baseline : une base créée avant Flyway est reprise telle quelle (version 1), seules les migrations suivantes s'appliquent.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
