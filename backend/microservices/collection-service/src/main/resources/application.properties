spring.application.name=collection-service
app.jwt.secret=${JWT_SECRET:Zm9yLWxvY2FsLWRldmVsb3BtZW50LW9ubHktc2VjcmV0LTIwMjY=}

# Photos d'annonces : 1 Mo au maximum (voir PhotoFormat.MAX_BYTES)
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

# Événements d'annonces publiés sur RabbitMQ (connexion : spring.rabbitmq.*)
app.events.enabled=true
# Une panne de RabbitMQ ne doit pas rendre le service indisponible.
management.health.rabbit.enabled=false
