name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  collection-service:
    name: Tests et Docker du service Java
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Tests et rapport JaCoCo
        working-directory: backend/microservices/collection-service
        run: ./mvnw -B verify

      - name: Publier le rapport JaCoCo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-jacoco-collection-service
          path: backend/microservices/collection-service/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Build image Docker
        working-directory: backend/microservices/collection-service
        run: docker build -t collection-service:ci .