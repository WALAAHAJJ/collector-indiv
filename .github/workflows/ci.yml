name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-couverture-frontend
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 14

  collection-service:
    name: Tests, SonarCloud et Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Tests et rapport JaCoCo
        working-directory: backend/microservices/collection-service
        run: ./mvnw -B verify

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Tests du frontend avec couverture
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage

      - name: Adapter les chemins du rapport de couverture pour Sonar
        run: sed -i 's#^SF:src/#SF:frontend/src/#' frontend/coverage/lcov.info

      - name: Analyse SonarCloud
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=walaahajj
            -Dsonar.projectKey=WALAAHAJJ_collector-indiv
            -Dsonar.sources=frontend/src,backend/microservices/collection-service/src/main/java
            -Dsonar.tests=backend/microservices/collection-service/src/test/java,frontend/tests
            -Dsonar.java.binaries=backend/microservices/collection-service/target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=backend/microservices/collection-service/target/site/jacoco/jacoco.xml
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
            -Dsonar.coverage.exclusions=frontend/src/main.tsx

      - name: Publier le rapport JaCoCo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-jacoco-collection-service
          path: backend/microservices/collection-service/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Build image Docker
        working-directory: backend/microservices/collection-service
        run: docker build -t collection-service:ci .

  user-service:
    name: User service - tests et Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Tests et rapport JaCoCo
        working-directory: backend/microservices/user-service
        run: ./mvnw -B verify

      - name: Publier le rapport JaCoCo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-jacoco-user-service
          path: backend/microservices/user-service/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Build image Docker
        working-directory: backend/microservices/user-service
        run: docker build -t user-service:ci .


  security-scan:
    name: Scan de sécurité (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Trivy - dépendances, secrets et configuration
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.70.0 fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            /src
