version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/backend/microservices/collection-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      # Spring Boot 4.2 a déplacé le code RabbitMQ hors du starter AMQP : on reste sur la 4.1
      # tant que le code n'est pas migré, et on ne reçoit que les correctifs (4.1.x).
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Le wrapper télécharge Maven au build : une version pas encore publiée sur Maven Central
      # casse la construction des images. La version du wrapper se change à la main.
      - dependency-name: "org.apache.maven:apache-maven"

  - package-ecosystem: "maven"
    directory: "/backend/microservices/notification-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      # Spring Boot 4.2 a déplacé le code RabbitMQ hors du starter AMQP : on reste sur la 4.1
      # tant que le code n'est pas migré, et on ne reçoit que les correctifs (4.1.x).
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Le wrapper télécharge Maven au build : une version pas encore publiée sur Maven Central
      # casse la construction des images. La version du wrapper se change à la main.
      - dependency-name: "org.apache.maven:apache-maven"

  - package-ecosystem: "maven"
    directory: "/backend/microservices/payment-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      # Spring Boot 4.2 a déplacé le code RabbitMQ hors du starter AMQP : on reste sur la 4.1
      # tant que le code n'est pas migré, et on ne reçoit que les correctifs (4.1.x).
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Le wrapper télécharge Maven au build : une version pas encore publiée sur Maven Central
      # casse la construction des images. La version du wrapper se change à la main.
      - dependency-name: "org.apache.maven:apache-maven"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/backend/microservices/collection-service"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "eclipse-temurin"
      - dependency-name: "maven"

  - package-ecosystem: "docker"
    directory: "/backend/microservices/notification-service"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "eclipse-temurin"
      - dependency-name: "maven"

  - package-ecosystem: "docker"
    directory: "/backend/microservices/payment-service"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "eclipse-temurin"
      - dependency-name: "maven"
