version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/backend/microservices/collection-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "maven"
    directory: "/backend/microservices/user-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/backend/microservices/collection-service"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "eclipse-temurin"
      - dependency-name: "maven"

  - package-ecosystem: "docker"
    directory: "/backend/microservices/user-service"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "eclipse-temurin"
      - dependency-name: "maven"
