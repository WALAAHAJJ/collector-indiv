apiVersion: v1
kind: Service
metadata:
  name: collection-service
  namespace: collector
spec:
  selector:
    app: collection-service
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collection-service
  namespace: collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collection-service
  template:
    metadata:
      labels:
        app: collection-service
    spec:
      containers:
        - name: collection-service
          image: ghcr.io/walaahajj/collector-indiv/collection-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://collection-db:5432/collector_collection"}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: {name: collector-secrets, key: POSTGRES_USER}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: {name: collector-secrets, key: POSTGRES_PASSWORD}
            - {name: SPRING_JPA_OPEN_IN_VIEW, value: "false"}
            - {name: KEYCLOAK_JWK_SET_URI, value: "http://keycloak:8080/realms/collector/protocol/openid-connect/certs"}
            - {name: SPRING_RABBITMQ_HOST, value: rabbitmq}
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef: {name: collector-secrets, key: RABBITMQ_USER}
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: {name: collector-secrets, key: RABBITMQ_PASSWORD}
            - {name: PAYMENT_SERVICE_URL, value: "http://payment-service:8080"}
            - name: APP_DEMO_DATA_ENABLED
              valueFrom:
                configMapKeyRef: {name: collector-config, key: DEMO_DATA}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
