apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: collector
spec:
  selector:
    app: rabbitmq
  ports:
    - {name: amqp, port: 5672}
    - {name: management, port: 15672}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: {name: collector-secrets, key: RABBITMQ_USER}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: {name: collector-secrets, key: RABBITMQ_PASSWORD}
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
